eval_batch_size: 2
optimizer: rmsprop
learning_rate: 1.0e-6
beta: 0.1
max_grad_norm: 1.0
epochs: 1
log_every: 5
eval_every: 50
seed: 42
policy_device: cuda:0
reference_device: cuda:0
output_dir: outputs/dpo_hh
